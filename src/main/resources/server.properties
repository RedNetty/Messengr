#  Chat Server Configuration
# =================================

# Server Settings
server.port=7234
server.max_clients=100
server.max_message_history=50

# Security Settings
security.admin_password=password123
security.enable_ip_banning=true
security.max_login_attempts=3

# Chat Room Settings
rooms.default_room=general
rooms.max_rooms=20
rooms.auto_create_user_rooms=true

# Message Settings
messages.max_length=500
messages.enable_emoji=true
messages.enable_formatting=true
messages.spam_protection=true

# Logging Settings
logging.enable_chat_log=true
logging.log_level=INFO
logging.log_file=chat_server.log

# Performance Settings
performance.cleanup_interval=30000
performance.inactive_timeout=1800000
performance.heartbeat_interval=60000

# Features
features.private_messaging=true
features.file_sharing=false
features.voice_chat=false
features.message_history=true